<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title></title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .letter {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.48);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease;
    z-index: 2;
  }
  .letter.visible { opacity: 1; pointer-events: auto; }
  .paper {
    width: min(390px, calc(100vw - 48px));
    padding: 14px 14px 24px;
    color: #30251d;
    background: #eee2c8;
    box-shadow: 0 18px 70px rgba(0, 0, 0, 0.65);
    font: 18px/1.65 Georgia, serif;
    transform: rotate(-1.2deg);
  }
  .paper img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    object-position: center 35%;
    margin-bottom: 22px;
  }
  .paper p { margin: 0 10px 18px; }
  .paper p:last-child { margin-bottom: 0; text-align: right; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="letter" id="letter" aria-hidden="true">
  <article class="paper">
    <img src="assets/WhatsApp%20Image%202026-11-12%20at%2008.04.02.jpeg" alt="Uma lembrança de um jantar especial">
    <p>Essa foto, amor. Um jantar diferente. Você estava tão linda, mas tão linda que eu não conseguia parar de pensar em te beijar tanto e dizer, nos meus pensamentos, que você era o amor da minha vida.</p>
  </article>
</div>
<script src="script.js"></script>
</body>
</html>
